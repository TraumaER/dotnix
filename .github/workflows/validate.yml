name: Validate
on: [push, pull_request]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v17
      - run: python3 -m unittest discover -s tests -v
      - run: nix develop --command shellcheck setup.sh scripts/dotnix
      - run: nix flake check --all-systems --no-build
      - run: nix flake check
      - run: ./setup.sh --no-install --non-interactive --destination "$RUNNER_TEMP/local config"
      - run: ./scripts/dotnix --config "$RUNNER_TEMP/local config" build
      - if: runner.os == 'macOS'
        run: |
          ./setup.sh --no-install --non-interactive --destination "$RUNNER_TEMP/local config" --reconfigure --mode darwin
          ./scripts/dotnix --config "$RUNNER_TEMP/local config" build
